# nginx vhost — team.floor.io redirects permanently to https://teamcli.io.
# Every path, with the query, on both HTTP and HTTPS ($request_uri). The certificate
# lines of this name stay so the redirect can be served over HTTPS.
# TLS by certbot: sudo certbot --nginx -d team.floor.io
server {
    server_name team.floor.io;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/team.floor.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/team.floor.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://teamcli.io$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name team.floor.io;
    return 301 https://teamcli.io$request_uri;
}
