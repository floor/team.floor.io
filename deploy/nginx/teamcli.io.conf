# nginx vhost: teamcli.io and www.teamcli.io, behind Cloudflare.
# Bun (pm2 "team.floor.io", port 4310) serves the site. TLS by certbot:
#   sudo certbot --nginx -d teamcli.io -d www.teamcli.io
server {
    server_name teamcli.io www.teamcli.io;

    include /etc/nginx/cloudflare/real-ip.conf;

    location ~ /\.well-known { allow all; }
    location ~ /\. { deny all; return 404; }

    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   $http_accept_encoding;
    }

    access_log /var/log/nginx/teamcli.io-access.log;
    error_log  /var/log/nginx/teamcli.io-error.log;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/teamcli.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/teamcli.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = teamcli.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name teamcli.io www.teamcli.io;
    return 404; # managed by Certbot


}