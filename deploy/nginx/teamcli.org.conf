# nginx vhost — teamcli.org and www.teamcli.org redirect permanently to https://teamcli.io.
# Path and query are kept ($request_uri). ACME challenges stay open so certbot can issue.
# TLS by certbot: sudo certbot --nginx -d teamcli.org -d www.teamcli.org
server {
    listen 80;
    listen [::]:80;
    server_name teamcli.org www.teamcli.org;

    location ~ /\.well-known { allow all; }
    location ~ /\. { deny all; return 404; }

    location / {
        return 301 https://teamcli.io$request_uri;
    }

    access_log /var/log/nginx/teamcli.org-access.log;
    error_log  /var/log/nginx/teamcli.org-error.log;
}
