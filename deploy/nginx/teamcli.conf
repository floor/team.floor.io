# nginx vhost — redirect teamcli.io and teamcli.org to team.floor.io
# TLS by certbot: sudo certbot --nginx -d teamcli.io -d www.teamcli.io -d teamcli.org -d www.teamcli.org
server {
    listen 80;
    listen [::]:80;
    server_name teamcli.io www.teamcli.io teamcli.org www.teamcli.org;

    location ~ /\.well-known { allow all; }
    location ~ /\. { deny all; return 404; }

    location / {
        return 301 https://team.floor.io$request_uri;
    }

    access_log /var/log/nginx/teamcli-access.log;
    error_log  /var/log/nginx/teamcli-error.log;
}
